:root{color-scheme:dark;--bg:#0a1427;--panel:#17243d;--panel2:#1c2e49;--border:#344761;--text:#edf3ff;--muted:#9eafc9;--teal:#70dfce;--lav:#afa5ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#224a60 0,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:3px}.shell{max-width:1050px;margin:auto;min-height:100vh}.hero{padding:26px 22px 19px;background:linear-gradient(135deg,#111e38bb,#152c44bb)}.ey{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--teal);font-weight:750}.heroTitle{display:flex;align-items:center;gap:16px;margin-top:14px}.orb{width:55px;height:55px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 27%,#d2fff5,#70d8d0 30%,#4c6fb4 69%,#273354);box-shadow:0 0 25px #62c9cf33}h1,h2.serif,h3.serif{font-family:Georgia,serif;font-weight:500;letter-spacing:-.7px}h1{font-size:clamp(25px,4vw,38px);margin:0}h2.serif{font-size:27px;margin:6px 0 10px}h3.serif{font-size:21px}.muted{color:var(--muted)}.small{font-size:13px;line-height:1.65}.nav{display:flex;gap:5px;overflow:auto;padding:11px 18px;border-block:1px solid #2d3e58;scrollbar-width:thin}.nav button{white-space:nowrap;padding:10px 13px;background:transparent;color:#adbed5;border:1px solid transparent;border-radius:9px;font-size:12px}.nav button.on{background:#21515a;border-color:#427a83;color:#b7fff3}.content{padding:23px;min-height:62vh}.card{border:1px solid var(--border);background:var(--panel);border-radius:13px;padding:17px;margin-bottom:12px}.tile{width:100%;background:var(--panel2);border:1px solid #3a4f6a;color:var(--text);padding:15px;text-align:left;border-radius:11px}.tile:hover,.option:hover{border-color:#71d9c9}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.btn{border:0;background:var(--teal);color:#08262c;border-radius:9px;padding:11px 15px;font-weight:750;font-size:12px}.btn.alt{background:#2b405c;color:#e4eeff;border:1px solid #455d7a}.btn:disabled{opacity:.45}.tag{display:inline-block;border:1px solid #465b73;border-radius:6px;padding:5px 8px;color:#c4d3e9;font-size:11px;background:#2a3d56}.tag.good{background:#16473f;border-color:#287465;color:#9ff3df}.tag.caution{background:#463729;border-color:#805f45;color:#ffd8aa}.bar{height:7px;background:#30415b;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--lav));transition:width .2s}.split{display:flex;justify-content:space-between;align-items:center;gap:10px}.field{width:100%;background:#101e34;border:1px solid #455c77;border-radius:9px;padding:11px;color:var(--text);font-size:13px}.option{display:block;width:100%;background:#1e304c;border:1px solid #3b526f;color:var(--text);text-align:left;border-radius:9px;padding:12px;margin:8px 0;font-size:13px}.option.chosen{background:#214e53;border-color:var(--teal)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.subnav{display:flex;gap:6px;overflow:auto;margin:12px 0 15px}.subnav button{cursor:pointer}.footer{border-top:1px solid #2c3e57;padding:16px 22px;font-size:11px;color:#9bacbf}.listrow{border-bottom:1px solid #ffffff18;padding:10px 0}.note{border-left:3px solid var(--teal);padding:9px 12px;background:#112c3b;border-radius:0 8px 8px 0}.chartrow{display:flex;gap:9px;align-items:center;margin:8px 0}.chartrow span{width:100px;font-size:11px;color:#b7c8dc}.chartrow .bar{flex:1}.stat{font-size:28px;font-variant-numeric:tabular-nums}.source{color:#93ddf2}.hide{display:none!important}@media(max-width:500px){.content{padding:13px}.hero{padding:20px 14px}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:13px}.nav{padding:8px}.nav button{font-size:11px;padding:9px 10px}}
</style></head><body><div class="shell"><header class="hero"><div class="split"><div class="ey">◈ Cognitive development environment</div><span class="tag good">STANDALONE · 2.0</span></div><div class="heroTitle"><div class="orb" aria-hidden="true"></div><div><h1>Mind Mastery <span style="color:var(--teal)">Lab</span></h1><div class="muted small">Learn the science. Train your thinking.</div></div></div></header><nav id="nav" class="nav" aria-label="App sections"></nav><main id="body" class="content"></main><footer class="footer split"><span>Evidence-informed · Offline-capable · Data stays in this browser</span><button id="reset" class="btn alt">Reset data</button></footer></div>
<script>
'use strict';(()=>{
const names=['Home','Mind Atlas','Cognitive Lab','Thinking Gym','Memory Studio','Speed Lab','Metacognition','Learning Coach','Progress'];
const lessons=[
['retrieval','Retrieval Practice','Memory','Strong','Actively recalling information improves later retention compared with passive restudy in many contexts.','Retrieval provides practice accessing knowledge; feedback helps correct mistakes.','Close the source and explain the main points from memory.','Roediger & Karpicke (2006)','https://doi.org/10.1111/j.1467-9280.2006.01693.x','What makes retrieval different from recognition?','Retrieval generates information without seeing the answer; recognition identifies presented information.'],
['spacing','Distributed Practice','Memory','Strong','Spreading study across time generally improves long-term retention.','Delayed retrieval opportunities support more durable learning.','Review tomorrow and again several days later rather than cramming.','Cepeda et al. (2006)','https://doi.org/10.1037/0033-2909.132.3.354','Why is spacing valuable?','It promotes learning across time and reduces reliance on immediate familiarity.'],
['elaboration','Elaborative Encoding','Memory','Strong','Processing meaning and making connections can support recall.','Semantic associations provide useful retrieval cues.','Explain a concept and connect it to two examples.','Craik & Lockhart (1972)','https://doi.org/10.1016/S0022-5371(72)80001-X','What does elaboration add?','Meaningful associations that can aid later retrieval.'],
['interleave','Interleaved Practice','Memory','Context-dependent','Mixing related problem types can improve discrimination and strategy selection.','Alternation requires identifying the appropriate approach.','Mix related problem types after first learning their fundamentals.','Dunlosky et al. (2013)','https://doi.org/10.1177/1529100612453266','When can interleaving help?','When selecting among similar methods or categories.'],
['working','Working Memory','Processing','Established model','Working memory temporarily maintains and manipulates task-relevant information.','Limited capacity constrains simultaneous processing.','Write down intermediate steps and group meaningful information.','Baddeley (2000)','https://doi.org/10.1016/S1364-6613(00)01538-2','How can you manage limited working memory?','Chunk, reduce distraction and externalize intermediate steps.'],
['load','Cognitive Load Theory','Processing','Established model','Learning design should account for limited working-memory resources.','Clear examples can reduce unnecessary demands, especially for beginners.','Study a worked example before tackling a new problem independently.','Sweller (1988)','https://doi.org/10.1207/s15516709cog1202_4','Why might worked examples help?','They demonstrate problem structure while reducing unnecessary search.'],
['automaticity','Automaticity','Processing','Established','Practice can speed familiar operations and reduce their attention demands.','Repeated processing builds efficient task-specific representations.','Practice reading unfamiliar charts of a recurring format.','Schneider & Shiffrin (1977)','https://doi.org/10.1037/0096-1523.3.1.1','Does automaticity guarantee general intelligence gains?','No, improvements are often task-specific.'],
['speed','Processing Speed','Processing','Qualified','Speed depends on perception, decisions, motor response and task familiarity.','Faster responses may reflect efficiency or a speed–accuracy tradeoff.','Measure speed and accuracy on comparable unfamiliar tasks.','Salthouse (1996)','https://doi.org/10.1037/0033-295X.103.3.403','Why track accuracy too?','Because faster responses can come with more errors.'],
['schema','Schema Theory','Cognition','Established','Prior knowledge structures shape comprehension, inference and recall.','Schemas support interpretation but can also bias memory.','Create a concept map linking new ideas to prior knowledge.','Bartlett (1932), Remembering','https://en.wikipedia.org/wiki/Remembering_(book)','Can schemas produce errors?','Yes, expectations can bias interpretation and recall.'],
['models','Mental Models','Cognition','Established','Internal representations help us explain and predict system behavior.','A model captures relevant relationships and enables predictions.','Draw a system and predict what changes when an input shifts.','Johnson-Laird (1983), Mental Models','https://en.wikipedia.org/wiki/Mental_Models','What makes a mental model useful?','Relevant relationships and testable predictions.'],
['dual','Dual-Process Accounts','Cognition','Qualified','Automatic and deliberative processes contribute to reasoning.','Intuition can be useful or biased; deliberate analysis can help but is not infallible.','Write your first intuition, then search for an alternative.','Evans & Stanovich (2013)','https://doi.org/10.1177/1745691612460685','Is slower always better?','No. Strategy should match task demands and expertise.'],
['transfer','Transfer of Learning','Cognition','Limited far transfer','Improving a trained task does not establish gains on unrelated tasks.','Transfer depends on shared structure and varied application.','Apply a reasoning principle in two different domains.','Sala & Gobet (2019)','https://doi.org/10.1177/1745691618815165','Why are brain-game scores insufficient?','They may reflect task-specific practice effects.'],
['monitor','Metacognitive Monitoring','Metacognition','Established','Monitoring means judging your own understanding, uncertainty and performance.','Compare confidence with actual outcomes to identify gaps.','Predict your score before testing, then compare it with results.','Dunlosky & Metcalfe (2009)','https://mitpress.mit.edu/9780262512830/metacognition/','Why can familiarity mislead?','Recognition can feel like mastery without independent recall.'],
['selfreg','Self-Regulated Learning','Metacognition','Established','Learners can set goals, monitor progress and adapt strategies.','Planning, feedback and reflection form a learning cycle.','Set a measurable goal and update your approach after testing.','Zimmerman (2002)','https://doi.org/10.1207/s15430421tip4102_2','What follows reflection?','A concrete adjustment to future learning.'],
['desirable','Desirable Difficulties','Metacognition','Context-dependent','Some manageable difficulties improve later retention.','Spacing and retrieval can add productive effort, but excessive difficulty harms learning.','Try recall before reopening notes, then correct mistakes.','Bjork & Bjork (2011)','https://bjorklab.psych.ucla.edu/research/','Is harder always better?','No, difficulty must be productive and supported.'],
['calibration','Confidence Calibration','Metacognition','Established','Calibration concerns agreement between subjective confidence and actual correctness.','Feedback reveals where certainty diverges from performance.','Rate confidence before answers and inspect calibration later.','Dunlosky & Metcalfe (2009)','https://mitpress.mit.edu/9780262512830/metacognition/','What is a calibration gap?','The difference between confidence and observed correctness over multiple answers.']
].map(x=>({id:x[0],name:x[1],domain:x[2],evidence:x[3],summary:x[4],mechanism:x[5],action:x[6],source:x[7],url:x[8],q:x[9],answer:x[10]}));
const quiz=[['Which is active retrieval?',['Rereading','Explaining without notes','Highlighting','Copying'],1,'Generating information without seeing it practices retrieval.'],['Which supports durable retention?',['Cramming','Recognition only','Spaced reviews','Speed reading only'],2,'Distributed practice generally improves long-term retention.'],['What can help beginners manage cognitive load?',['More simultaneous instructions','Clear worked examples','Time pressure','No intermediate steps'],1,'Worked examples reduce unnecessary search.'],['What supports processing efficiency gains?',['Repeated game scores','Faster correct performance on comparable new tasks','Feeling sharper','Speed alone'],1,'New tasks and accuracy checks reduce practice-effect confounds.'],['What is defensible about brain training?',['It always boosts IQ','It never improves practiced tasks','Broad transfer is not guaranteed','It eliminates working-memory limits'],2,'Far transfer is often limited or inconsistent.'],['What is calibration?',['High confidence','Alignment of confidence and correctness','No uncertainty','Replacing evidence'],1,'Calibration compares subjective probabilities with outcomes.'],['What makes a mental model useful?',['Complexity','Relevant predictions','Never changing','Matching intuition'],1,'Useful models preserve important causal structure.'],['Why can interleaving help?',['No prior learning needed','Discriminating problem types','No forgetting','Always faster immediately'],1,'Mixing can improve strategy selection.'],['How does expertise often improve performance?',['Always slower reasoning','General intelligence alone','Organized domain knowledge','Never using intuition'],2,'Expertise relies on domain-specific representations.'],['How can you test understanding?',['Feeling familiar','Explaining and applying without notes','Rereading','Highlighting'],1,'Independent explanation is more diagnostic.'],['Can schemas bias memory?',['No','Yes','Only in children','Only during sleep'],1,'Expectations can influence recall.'],['What should follow a reasoning error?',['Ignore it','Repeat the same method','Adjust and retest','Increase confidence'],2,'Feedback should inform the next strategy.']].map(x=>({q:x[0],o:x[1],a:x[2],why:x[3]}));
const challenges=[['causal','Causal reasoning','A city introduces a flood-warning campaign. Evacuation rates rise the following year. Does this establish causation?','Consider confounders, comparison groups and alternative explanations.','No. A before–after change alone cannot isolate the campaign from hazard severity, population changes or other policies. A stronger comparison design is needed.'],['systems','Systems thinking','A city widens a road. Congestion briefly falls but returns. What might explain this?','Consider feedback and induced demand.','Lower travel costs can attract trips, routes or development; demand and capacity interact over time.'],['prob','Probabilistic reasoning','A test has 90% sensitivity and specificity. A condition affects 1% of people. Is a positive result more likely true than false?','Imagine 10,000 people.','Of 10,000 people, about 90 true positives and 990 false positives occur. Positive predictive value is about 8.3%.'],['transfer','Knowledge transfer','Explain how feedback loops apply to both studying and managing a public program.','Identify actions, measurements and adjustments.','Retrieval results guide review; program indicators guide interventions. Both use outcomes to update future actions.']].map(x=>({id:x[0],name:x[1],q:x[2],hint:x[3],sample:x[4]}));
const flash=[['What is retrieval practice?','Reconstructing knowledge from memory rather than simply recognizing or rereading.'],['What is cognitive load?','Demands placed on limited working-memory resources.'],['What is metacognitive calibration?','Agreement between confidence judgments and actual performance.'],['What is a schema?','An organized structure of prior knowledge guiding interpretation and recall.'],['What is transfer?','Applying knowledge acquired in one context to another.'],['What is the spacing effect?','A general retention benefit of distributing study across time.'],['What is a mental model?','An internal representation used for explanation and prediction.'],['What is a speed–accuracy tradeoff?','Faster responses sometimes come with more errors.']];
const cal=[['Does retrieval practice generally support long-term retention?',1,'A substantial evidence base supports retrieval practice.'],['Do working-memory game gains reliably increase general intelligence?',0,'Far transfer is not reliably established.'],['Can prior knowledge reduce working-memory demands?',1,'Knowledge can support meaningful chunking.'],['Does faster responding always mean better reasoning?',0,'Speed–accuracy tradeoffs matter.'],['Can confidence be high when recall is poor?',1,'Familiarity can inflate confidence.'],['Is all learning difficulty beneficial?',0,'Excessive difficulty can impair learning.'],['Can schemas both aid comprehension and distort recall?',1,'Schemas can guide and bias memory.'],['Can feedback help develop expertise?',1,'Informative feedback supports targeted improvement.']].map(x=>({q:x[0],a:x[1],why:x[2]}));
const compares=[[47,74],[86,68],[39,93],[72,27],[58,85],[91,19],[64,46],[38,83],[95,59],[26,62]];
const KEY='mind-mastery-lab-v2-data';const defaults=()=>({read:[],history:[],review:{},quiz:[],cal:[],flashStats:{},settings:{goal:'Memory'},practice:[]});let saved=defaults();try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&typeof d==='object')saved={...saved,...d}}catch{}
let S={page:0,domain:'All',lesson:'retrieval',exp:'span',digits:'',spanN:5,spanVisible:false,spanMessage:'',spanToken:0,stroopN:0,stroopData:[],stroopStart:0,speedN:0,speedData:[],speedStart:0,challenge:'causal',challengeText:'',challengeShow:false,flashI:0,flashReveal:false,qi:0,qDone:false,calI:0,calDone:false,conf:70,practiceStage:0,practiceAnswers:['','','','',''],lastFeedback:'',loadN:5,loadStyle:0};
const $=id=>document.getElementById(id),body=$('body'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const B=(t,a,alt=false)=>`<button class="btn ${alt?'alt':''}" data-act="${a}">${t}</button>`;const head=(k,t,d)=>`<div class="ey">${k}</div><h2 class="serif">${t}</h2><p class="small muted">${d}</p>`;const mark=(s)=>`<span class="tag ${s==='Strong'?'good':s==='Limited far transfer'?'caution':''}">${esc(s)}</span>`;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}}function log(type,detail){saved.history.push({type,detail,at:new Date().toISOString()});saved.history=saved.history.slice(-1000);persist()}function readLesson(id){if(!saved.read.includes(id)){saved.read.push(id);log('Lesson explored',id)}}function go(n){S.page=n;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){ $('nav').innerHTML=names.map((n,i)=>`<button data-page="${i}" class="${S.page===i?'on':''}" ${S.page===i?'aria-current="page"':''}>${n}</button>`).join('');[home,atlas,lab,gym,memory,speed,meta,coach,progress][S.page]();}
function home(){body.innerHTML=head('Your cognitive development workspace','Understand your mind. Train with intention.','Explore research, experience demonstrations, practice meaningful reasoning and review your learning over time.')+`<div class="g3"><div class="card"><div class="ey">Theories</div><div class="stat">${lessons.length}</div><div class="small muted">Available</div></div><div class="card"><div class="ey">Explored</div><div class="stat">${saved.read.length}</div><div class="small muted">Persistent</div></div><div class="card"><div class="ey">Activities</div><div class="stat">${saved.history.length}</div><div class="small muted">Logged</div></div></div><div class="card"><div class="split small"><b>Theory exploration</b><span>${Math.round(saved.read.length/lessons.length*100)}%</span></div><div class="bar" style="margin-top:10px"><div style="width:${saved.read.length/lessons.length*100}%"></div></div></div><div class="ey" style="margin:18px 0 11px">Learning environments</div><div class="g2">${names.slice(1).map((n,i)=>`<button class="tile" data-page="${i+1}"><div style="font-size:21px;color:var(--teal);margin-bottom:7px">${['◈','⚗','◇','▤','↗','◎','✦','▥'][i]}</div><b>${n}</b><div class="small muted">${['Explore cognitive theories','Test cognitive principles','Practice real reasoning','Strengthen retrieval','Track speed and accuracy','Calibrate confidence','Follow guided learning','Review longitudinal activity'][i]}</div></button>`).join('')}</div><div class="card" style="margin-top:14px"><div class="ey">Recommended starting point</div><h3 class="serif">Learn how to judge your own understanding</h3><p class="small muted">Begin with metacognitive monitoring and retrieval practice. Then apply the techniques to real tasks.</p>${B('Open Learning Coach','goCoach')}</div>`}
function atlas(){let t=lessons.find(x=>x.id===S.lesson);body.innerHTML=head('Scientific knowledge base','Mind Atlas','Explore 16 foundational topics with practice prompts and source references. Labels qualify evidence for each principle, not claims of broad cognitive enhancement.')+`<div class="subnav">${['All','Memory','Processing','Cognition','Metacognition'].map(x=>`<button class="tag" style="${S.domain===x?'background:#23545b':''}" data-domain="${x}">${x}</button>`).join('')}</div><div class="g2">${lessons.filter(x=>S.domain==='All'||x.domain===S.domain).map(x=>`<button class="tile" data-lesson="${x.id}" style="${x.id===S.lesson?'border-color:var(--teal)':''}"><div class="ey">${x.domain}</div><b class="small">${esc(x.name)}</b><div class="small muted">${saved.read.includes(x.id)?'✓ Explored':'Open lesson'}</div></button>`).join('')}</div><div class="card" style="margin-top:15px;border-color:#47817d"><div class="ey">Selected lesson</div><h3 class="serif">${esc(t.name)}</h3>${mark(t.evidence)}<p class="small">${esc(t.summary)}</p><div class="ey">How it works</div><p class="small muted">${esc(t.mechanism)}</p><div class="ey">Try it yourself</div><p class="small muted">${esc(t.action)}</p><div class="ey">Test your understanding</div><p class="small">${esc(t.q)}</p><details class="small"><summary style="cursor:pointer;color:var(--teal)">Reveal explanation</summary><p>${esc(t.answer)}</p></details><div class="actions">${B(saved.read.includes(t.id)?'✓ Explored':'Mark explored','markRead')}${B('Schedule review','schedule',true)}</div><p class="small muted">Research: <a class="source" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${esc(t.source)} ↗</a></p></div>`}
function lab(){body.innerHTML=head('Interactive cognition demonstrations','Cognitive Lab','Educational simulations and brief tasks. Not standardized tests or measures of intelligence.')+`<div class="subnav">${[['span','Digit span'],['stroop','Stroop effect'],['load','Cognitive load']].map(([id,t])=>`<button class="tag" data-exp="${id}" style="${S.exp===id?'background:#23545b':''}">${t}</button>`).join('')}</div><div id="exp"></div>`;expRender()}
function expRender(){const el=$('exp');if(!el)return;if(S.exp==='span'){el.innerHTML=`<div class="card"><div class="ey">Immediate serial recall</div><h3 class="serif">Digit Span</h3><p class="small muted">View a sequence briefly, then reproduce it in the same order. Scores vary substantially across trials.</p><div class="split small"><span>Digits</span><b>${S.spanN}</b></div><input id="spanrange" type="range" min="3" max="9" value="${S.spanN}" style="width:100%;accent-color:var(--teal)"><div style="text-align:center;font-size:30px;letter-spacing:4px;margin:25px 0;min-height:42px">${S.spanVisible?S.digits.split('').join(' '):'• • • •'}</div>${!S.spanVisible?'<input class="field" id="spaninput" inputmode="numeric" autocomplete="off" placeholder="Enter the sequence">':''}<div class="actions">${B('New sequence','newSpan')}${!S.spanVisible?B('Check recall','checkSpan',true):''}</div><p class="small muted" aria-live="polite">${esc(S.spanMessage)}</p></div>`;return}if(S.exp==='stroop'){let names=['RED','BLUE','GREEN','YELLOW'],colors=['#fa7777','#76a9fa','#6ee7b7','#facc65'];let word=S.stroopN%4,ink=(word+1+(Math.floor(S.stroopN/4)%3))%4;let d=S.stroopData;el.innerHTML=`<div class="card"><div class="ey">Attention and interference</div><h3 class="serif">Stroop Challenge</h3><p class="small muted">Select the ink color, not the written word. This simplified version uses incongruent trials and cannot estimate a standardized Stroop interference score.</p><div style="text-align:center;color:${colors[ink]};font-size:38px;font-weight:800;margin:24px 0">${names[word]}</div><div class="g2">${names.map((x,i)=>`<button class="option" data-stroop="${i}" style="text-align:center">${x}</button>`).join('')}</div><p class="small muted">Trials: ${d.length} · Accuracy: ${d.length?Math.round(d.filter(x=>x.ok).length/d.length*100)+'%':'—'} · Mean time: ${d.length?Math.round(d.reduce((a,x)=>a+x.ms,0)/d.length)+' ms':'—'}</p>${B('Restart','resetStroop',true)}</div>`;S.stroopStart=performance.now();return}el.innerHTML=`<div class="card"><div class="ey">Conceptual simulation</div><h3 class="serif">Cognitive Load Explorer</h3><p class="small muted">Explore how information quantity and organization may affect task demands. Values are illustrative, not measured neural capacity.</p><div class="split small"><span>Information elements</span><b>${S.loadN}</b></div><input id="loadrange" type="range" min="2" max="12" value="${S.loadN}" style="width:100%;accent-color:var(--teal)"><label class="small" for="loadstyle">Presentation style</label><select id="loadstyle" class="field" style="margin:8px 0"><option value="0" ${S.loadStyle===0?'selected':''}>Organized and grouped</option><option value="1" ${S.loadStyle===1?'selected':''}>Unstructured</option><option value="2" ${S.loadStyle===2?'selected':''}>Unstructured with distraction</option></select><div class="card"><div class="split"><span class="small">Illustrative relative demand</span><b id="loadvalue"></b></div><div class="bar" style="margin-top:10px"><div id="loadbar"></div></div></div><p class="small muted">The relationship is conceptual. Real cognitive load depends on expertise, content and task design.</p></div>`;updateLoad()}
function updateLoad(){if(!$('loadrange'))return;S.loadN=+$('loadrange').value;S.loadStyle=+$('loadstyle').value;let v=Math.min(100,S.loadN*6+S.loadStyle*16);$('loadvalue').textContent=v+'/100';$('loadbar').style.width=v+'%'}
function gym(){let c=challenges.find(x=>x.id===S.challenge);body.innerHTML=head('Apply knowledge to authentic problems','Thinking Gym','Develop causal inference, systems thinking, probabilistic reasoning and transfer. Compare your reasoning with a model explanation.')+`<div class="g2">${challenges.map(x=>`<button class="tile" data-challenge="${x.id}" style="${x.id===S.challenge?'border-color:var(--teal)':''}"><b class="small">${x.name}</b></button>`).join('')}</div><div class="card" style="margin-top:13px"><div class="ey">Reasoning challenge</div><h3 style="font-size:17px;line-height:1.5">${esc(c.q)}</h3><details class="small"><summary style="cursor:pointer">Thinking hint</summary><p class="muted">${esc(c.hint)}</p></details><textarea id="gymtext" class="field" rows="6" placeholder="Explain your reasoning, assumptions and alternative explanations..." style="margin:13px 0">${esc(S.challengeText)}</textarea>${B('Compare with model explanation','gymCheck')}${S.challengeShow?`<div class="note" style="margin-top:14px"><div class="ey">Model reasoning</div><p class="small">${esc(c.sample)}</p><p class="small muted">Compare explanations for missing assumptions. This is not automatic grading.</p></div>`:''}</div>`}
function memory(){let i=S.flashI%flash.length,f=flash[i],stat=saved.flashStats[i]||{good:0,again:0};body.innerHTML=head('Durable encoding and recall','Memory Studio','Try to retrieve each answer before revealing it. The built-in flashcards teach core principles.')+`<div class="card" style="min-height:260px;display:flex;flex-direction:column;justify-content:center;text-align:center"><div class="ey">Card ${i+1} / ${flash.length}</div><h3 class="serif" style="margin:24px 0">${esc(S.flashReveal?f[1]:f[0])}</h3>${S.flashReveal?`<div class="g2">${B('Needs review','flashAgain',true)}${B('Recalled correctly','flashGood')}</div>`:B('Reveal answer','flashReveal')}</div><div class="card"><div class="ey">This card</div><p class="small muted">Self-reported recalled: ${stat.good||0} · Needs review: ${stat.again||0}</p></div><div class="card"><div class="ey">Scheduled theory reviews</div><p class="small muted">${Object.keys(saved.review).length} concepts in your queue. Due dates use a simple interval schedule, not a validated adaptive memory algorithm.</p>${Object.entries(saved.review).filter(([id,v])=>v.due<=Date.now()).slice(0,8).map(([id])=>`<button class="option" data-review="${esc(id)}">Review: ${esc(lessons.find(x=>x.id===id)?.name||id)}</button>`).join('')||'<p class="small muted">No reviews currently due.</p>'}</div>`}
function speed(){let a=compares[S.speedN%compares.length],d=S.speedData;let accuracy=d.length?Math.round(d.filter(x=>x.ok).length/d.length*100)+'%':'—',mean=d.length?Math.round(d.reduce((n,x)=>n+x.ms,0)/d.length):'—';body.innerHTML=head('Processing efficiency and accuracy','Speed Lab','Choose the larger number quickly but accurately. This is a repeated discrimination task, not a general processing-speed assessment.')+`<div class="g3"><div class="card"><div class="ey">Trials</div><div class="stat">${d.length}</div></div><div class="card"><div class="ey">Accuracy</div><div class="stat">${accuracy}</div></div><div class="card"><div class="ey">Mean ms</div><div class="stat">${mean}</div></div></div><div class="card"><div class="ey">Number comparison</div><h3 style="text-align:center">Which is larger?</h3><div class="g2" style="margin:20px 0"><button class="option" data-compare="0" style="text-align:center;font-size:28px">${a[0]}</button><button class="option" data-compare="1" style="text-align:center;font-size:28px">${a[1]}</button></div>${B('Restart trials','speedReset',true)}</div><div class="card"><div class="ey">Interpretation</div><p class="small muted">Device input latency, task repetition and response strategy affect times. Track accuracy and compare performance on unfamiliar, equivalent tasks before drawing conclusions.</p></div>`;S.speedStart=performance.now()}
function meta(){let answers=saved.cal,q=cal[S.calI],n=answers.length,correct=answers.filter(x=>x.ok).length,acc=n?Math.round(correct/n*100):0,conf=n?Math.round(answers.reduce((a,x)=>a+x.conf,0)/n):0;body.innerHTML=head('Monitor your own thinking','Metacognition Lab','Rate confidence in your answer before responding. Compare predictions with actual correctness.')+(S.calDone?`<div class="card"><div class="ey">Calibration results</div><div class="g2"><div><div class="small muted">Accuracy</div><div class="stat">${acc}%</div></div><div><div class="small muted">Mean confidence</div><div class="stat">${conf}%</div></div></div><p class="small muted">Mean confidence–accuracy gap: ${Math.abs(conf-acc)} percentage points. With only eight items, this is noisy and does not capture all aspects of calibration.</p>${B('Restart calibration','calReset')}</div>`:`<div class="card"><div class="split"><span class="ey">Question ${S.calI+1} / ${cal.length}</span><span class="tag">True or false</span></div><h3 style="font-size:17px;line-height:1.5">${esc(q.q)}</h3><div class="split small"><span>Confidence in your answer</span><b id="confdisplay">${S.conf}%</b></div><input type="range" id="confrange" min="50" max="100" step="5" value="${S.conf}" style="width:100%;accent-color:var(--teal);margin:13px 0"><div class="g2"><button class="option" data-cal="1" style="text-align:center">True</button><button class="option" data-cal="0" style="text-align:center">False</button></div></div>`)+`<div class="card"><div class="ey">Metacognitive insight</div><p class="small muted">Good calibration means confidence levels align with actual correctness over many predictions. Feeling familiar with material does not establish mastery.</p></div>`}
function coach(){let goal=saved.settings.goal;let next=lessons.find(x=>x.domain===goal&&!saved.read.includes(x.id))||lessons.find(x=>x.domain===goal);let due=Object.entries(saved.review).filter(([,v])=>v.due<=Date.now()).length;body.innerHTML=head('Guided learning sequence','Learning Coach','A transparent rule-based guide that prioritizes unexplored material and scheduled reviews. No AI service or account required.')+`<div class="card"><div class="ey">Primary learning objective</div><div class="g2" style="margin:10px 0">${['Memory','Processing','Cognition','Metacognition'].map(x=>`<button class="tile" data-goal="${x}" style="${goal===x?'border-color:var(--teal);background:#22464e':''}">${x}</button>`).join('')}</div><div class="ey" style="margin:18px 0 8px">Your recommended learning cycle</div><div class="small" style="line-height:2.6">① Explore: <b>${esc(next.name)}</b><br>② Explain without notes<br>③ Test with retrieval questions<br>④ Apply to a real problem<br>⑤ Return for spaced review</div><div class="actions">${B('Open recommended lesson','coachLesson')}${B('Knowledge check','coachQuiz',true)}</div></div><div class="card"><div class="ey">Learning signals</div><p class="small muted">Lessons explored: ${saved.read.length} · Reviews due: ${due} · Knowledge questions answered: ${saved.quiz.filter(Boolean).length}</p><p class="small muted">The coach does not infer intelligence or prescribe medical interventions.</p></div>`}
function progress(){let n=saved.history.length,correct=saved.quiz.filter((x,i)=>x&&x.choice===quiz[i].a).length,answered=saved.quiz.filter(Boolean).length;body.innerHTML=head('Your learning record','Progress Studio','Activity is saved in this browser using local storage. Export a backup to transfer between devices or browsers.')+`<div class="g3"><div class="card"><div class="ey">Lessons</div><div class="stat">${saved.read.length}</div></div><div class="card"><div class="ey">Activities</div><div class="stat">${n}</div></div><div class="card"><div class="ey">Quiz</div><div class="stat">${answered?Math.round(correct/answered*100)+'%':'—'}</div></div></div><div class="card"><div class="ey">Recent activity</div>${n?saved.history.slice(-20).reverse().map(x=>`<div class="listrow"><b class="small">${esc(x.type)}</b><div class="small muted">${esc(x.detail)}</div><div class="muted" style="font-size:10px">${esc(new Date(x.at).toLocaleString())}</div></div>`).join(''):'<p class="small muted">Activities appear here as you learn and practice.</p>'}</div><div class="card"><div class="ey">Data management</div><p class="small muted">Export or import a JSON backup. Written reasoning entries may be included in exported data. No information is uploaded by this app.</p><div class="actions">${B('Export backup','export')}${B('Import backup','import',true)}</div><input type="file" id="importfile" accept=".json,application/json" hidden></div><div class="card"><div class="ey">Measurement caution</div><p class="small muted">A higher score on repeated exercises is not proof of improved general cognitive ability. Use delayed retention, unfamiliar problems, accuracy and real-world task outcomes to evaluate improvement.</p></div>`}
function knowledge(){let q=quiz[S.qi],a=saved.quiz[S.qi];body.innerHTML=head('Retrieval and understanding','Knowledge Check','Answer questions about cognitive science and review feedback.')+(S.qDone?`<div class="card"><div class="ey">Assessment complete</div><h3 class="serif">${saved.quiz.filter((x,i)=>x?.choice===quiz[i].a).length} / ${quiz.length} correct</h3><p class="small muted">This is a small educational quiz, not a cognitive ability test.</p>${B('Retake quiz','quizReset')}</div>`:`<div class="card"><div class="ey">Question ${S.qi+1} of ${quiz.length}</div><div class="bar" style="margin:12px 0"><div style="width:${(S.qi+1)/quiz.length*100}%"></div></div><h3 style="font-size:17px">${esc(q.q)}</h3>${q.o.map((x,i)=>`<button class="option ${a?.choice===i?'chosen':''}" data-answer="${i}" ${a?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join('')}${a?`<div class="note"><b>${a.choice===q.a?'Correct':'Review needed'}</b><p class="small">${esc(q.why)}</p></div><div class="actions">${B(S.qi===quiz.length-1?'Finish quiz':'Next question','quizNext')}</div>`:''}</div>`)}
// The knowledge check is accessed from the coach as a temporary view without changing the primary navigation.
let showingQuiz=false;const originalRender=render;function redraw(){if(showingQuiz){$('nav').innerHTML=names.map((n,i)=>`<button data-page="${i}">${n}</button>`).join('');knowledge()}else originalRender()}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(!b)return;showingQuiz=false;go(+b.dataset.page)});
body.addEventListener('input',e=>{if(e.target.id==='spanrange'){S.spanN=+e.target.value;expRender()}if(e.target.id==='loadrange'||e.target.id==='loadstyle')updateLoad();if(e.target.id==='gymtext')S.challengeText=e.target.value;if(e.target.id==='confrange'){S.conf=+e.target.value;$('confdisplay').textContent=S.conf+'%'}});
body.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page!==undefined){showingQuiz=false;go(+b.dataset.page);return}if(b.dataset.domain){S.domain=b.dataset.domain;redraw();return}if(b.dataset.lesson){S.lesson=b.dataset.lesson;readLesson(S.lesson);redraw();return}if(b.dataset.exp){S.exp=b.dataset.exp;redraw();return}if(b.dataset.challenge){S.challenge=b.dataset.challenge;S.challengeText='';S.challengeShow=false;redraw();return}if(b.dataset.goal){saved.settings.goal=b.dataset.goal;persist();redraw();return}if(b.dataset.review){S.lesson=b.dataset.review;S.domain='All';showingQuiz=false;go(1);return}
if(b.dataset.stroop!==undefined){let word=S.stroopN%4,ink=(word+1+Math.floor(S.stroopN/4)%3)%4,ms=Math.round(performance.now()-S.stroopStart),ok=+b.dataset.stroop===ink;S.stroopData.push({ms,ok});S.stroopN++;if(S.stroopN%5===0)log('Stroop',`${S.stroopN} trials, ${S.stroopData.filter(x=>x.ok).length} correct`);expRender();return}
if(b.dataset.compare!==undefined){let [a,c]=compares[S.speedN%compares.length],ms=Math.round(performance.now()-S.speedStart),ok=(+b.dataset.compare===0?a:c)===Math.max(a,c);S.speedData.push({ms,ok});S.speedN++;if(S.speedN%5===0)log('Speed Lab',`${S.speedN} trials, ${S.speedData.filter(x=>x.ok).length} correct`);redraw();return}
if(b.dataset.cal!==undefined){let ok=+b.dataset.cal===cal[S.calI].a;saved.cal.push({ok,conf:S.conf,at:new Date().toISOString()});log('Calibration',`${ok?'Correct':'Incorrect'} at ${S.conf}% confidence`);S.calI++;S.conf=70;if(S.calI>=cal.length)S.calDone=true;redraw();return}
if(b.dataset.answer!==undefined&&!saved.quiz[S.qi]){let choice=+b.dataset.answer;saved.quiz[S.qi]={choice};log('Knowledge check',`Question ${S.qi+1}: ${choice===quiz[S.qi].a?'correct':'incorrect'}`);redraw();return}
switch(b.dataset.act){case 'goCoach':showingQuiz=false;go(7);return;case 'markRead':readLesson(S.lesson);break;case 'schedule':{let old=saved.review[S.lesson];let interval=old?Math.min(30,old.interval*2):1;saved.review[S.lesson]={due:Date.now()+interval*86400000,interval};log('Review scheduled',`${S.lesson} in ${interval} day(s)`);break}case 'newSpan':{S.digits=Array.from({length:S.spanN},()=>Math.floor(Math.random()*10)).join('');S.spanVisible=true;S.spanMessage='Memorize the digits';let token=++S.spanToken;expRender();setTimeout(()=>{if(token===S.spanToken&&S.spanVisible){S.spanVisible=false;expRender()}},Math.max(1800,S.spanN*600));return}case 'checkSpan':{let v=$('spaninput')?.value.trim();if(!S.digits){S.spanMessage='Generate a sequence first.';break}if(!v){S.spanMessage='Enter the digits you recall.';break}let ok=v===S.digits;S.spanMessage=`${ok?'Correct':'Not quite'} · Expected ${S.digits} · Entered ${v}`;log('Digit span',`${S.spanN} digits · ${ok?'correct':'incorrect'}`);S.digits='';break}case 'resetStroop':S.stroopN=0;S.stroopData=[];break;case 'gymCheck':S.challengeShow=true;log('Reasoning challenge',`${S.challenge}: ${S.challengeText.slice(0,500)}`);break;case 'flashReveal':S.flashReveal=true;break;case 'flashAgain':case 'flashGood':{let i=S.flashI%flash.length,st=saved.flashStats[i]||{good:0,again:0};st[b.dataset.act==='flashGood'?'good':'again']++;saved.flashStats[i]=st;log('Memory retrieval',`${flash[i][0]} · ${b.dataset.act==='flashGood'?'recalled':'needs review'}`);S.flashI++;S.flashReveal=false;break}case 'speedReset':S.speedN=0;S.speedData=[];break;case 'calReset':S.calI=0;S.calDone=false;S.conf=70;saved.cal=[];persist();break;case 'coachLesson':{let goal=saved.settings.goal,t=lessons.find(x=>x.domain===goal&&!saved.read.includes(x.id))||lessons.find(x=>x.domain===goal);S.lesson=t.id;S.domain=goal;showingQuiz=false;go(1);return}case 'coachQuiz':showingQuiz=true;redraw();return;case 'quizNext':if(S.qi===quiz.length-1){S.qDone=true}else S.qi++;break;case 'quizReset':saved.quiz=[];S.qi=0;S.qDone=false;persist();break;case 'export':{let blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),data:saved},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mind-mastery-lab-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}case 'import':$('importfile')?.click();return;}redraw()});
body.addEventListener('change',e=>{if(e.target.id!=='importfile')return;let f=e.target.files?.[0];if(!f)return;if(f.size>2000000){alert('File too large');return}let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(d.version!==2||!d.data||!Array.isArray(d.data.history)||!Array.isArray(d.data.read))throw Error('Invalid format');let x=d.data;saved={read:x.read.filter(v=>lessons.some(t=>t.id===v)),history:x.history.slice(-1000).filter(v=>v&&typeof v.type==='string'),review:x.review&&typeof x.review==='object'?x.review:{},quiz:Array.isArray(x.quiz)?x.quiz.slice(0,quiz.length):[],cal:Array.isArray(x.cal)?x.cal.slice(0,cal.length):[],flashStats:x.flashStats&&typeof x.flashStats==='object'?x.flashStats:{},settings:{goal:['Memory','Processing','Cognition','Metacognition'].includes(x.settings?.goal)?x.settings.goal:'Memory'},practice:[]};S.qi=Math.min(saved.quiz.length,quiz.length-1);S.qDone=saved.quiz.length===quiz.length;S.calI=Math.min(saved.cal.length,cal.length);S.calDone=S.calI===cal.length;persist();redraw();alert('Backup imported')}catch{alert('Unable to import: invalid Mind Mastery Lab backup')}};reader.readAsText(f)});
$('reset').addEventListener('click',()=>{if(!confirm('Delete saved progress in this browser? Export a backup first if needed.'))return;saved=defaults();S.qi=0;S.qDone=false;S.calI=0;S.calDone=false;S.flashI=0;S.page=0;showingQuiz=false;persist();redraw()});
redraw();
})();
</script></body></html>
